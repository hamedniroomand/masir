name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tag matches package.json and CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package" ]; then
            echo "tag v$version but package.json says $package"
            exit 1
          fi
          if ! grep -Eq "^## \[?$version\]?( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  # Each platform builds on a native runner. Under QEMU the arm64 build took
  # more than an hour on a cold cache.
  build:
    needs: ci
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Save digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          retention-days: 1

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Push the multi-platform manifest
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

  deploy:
    needs: image
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Back up, pull, and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ vars.VPS_PATH || 'masir' }}"
            git fetch --tags --force origin
            git checkout --force "$TAG"
            export MASIR_VERSION="${TAG#v}"
            # The app migrates on boot. A dump taken before the restart is the
            # only way back from a migration that deletes data.
            mkdir -p backups
            docker compose -f compose.image.yaml exec -T db pg_dump -U masir -d masir -Fc > "backups/masir-$(date -u +%Y%m%dT%H%M%SZ)-before-$MASIR_VERSION.dump"
            docker compose -f compose.image.yaml pull
            docker compose -f compose.image.yaml up -d --wait
            docker image prune -f

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { on = ($2 == v || $2 == "[" v "]") }
            on
          ' CHANGELOG.md | tail -n +2 > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
