name: ci

# Tag pushes run through release.yml, which calls this workflow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: masir
          POSTGRES_PASSWORD: masir
          POSTGRES_DB: masir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:coverage
        env:
          NUXT_SESSION_PASSWORD: 01234567890123456789012345678901
          TEST_DATABASE_URL: postgres://masir:masir@127.0.0.1:5432/masir_test
          NUXT_PUBLIC_SHORT_DOMAIN: http://localhost:3000

      - name: Redirect benchmark
        run: bun run scripts/bench-redirect.ts -n 50

  # A pull request that changes only docs, changesets, or Markdown cannot change
  # what the browser sees. Pushes to main and release tags always run the job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changed files
        id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo app=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qvE '^(docs/|\.changeset/)|\.md$'; then
            echo app=true >> "$GITHUB_OUTPUT"
          else
            echo app=false >> "$GITHUB_OUTPUT"
          fi

  browser:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: masir
          POSTGRES_PASSWORD: masir
          POSTGRES_DB: masir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser tests
        run: bun run test:browser
        env:
          TEST_DATABASE_URL: postgres://masir:masir@127.0.0.1:5432/masir_test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
