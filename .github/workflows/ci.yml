name: ci

on: push

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
        env:
          NUXT_SESSION_PASSWORD: 01234567890123456789012345678901
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          NUXT_PUBLIC_SHORT_DOMAIN: http://localhost:3000

  upgrade:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The script needs every tag to find the previous release.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Upgrade from previous tag
        run: scripts/upgrade-test.sh
        env:
          NUXT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          NUXT_SESSION_PASSWORD: 01234567890123456789012345678901
          NUXT_PUBLIC_SHORT_DOMAIN: http://localhost:3000
